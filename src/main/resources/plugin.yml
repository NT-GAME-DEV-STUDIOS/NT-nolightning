name: NT-nolightning
version: '${version}'
main: de.noblitz.NoBlitzPlugin
author: Antigravity
description: High-performance, customizable lightning and thunderstorm protection plugin for Minecraft.
website: https://github.com/NT-GAME-DEV-STUDIOS/NT-nolightning

commands:
  nolightning:
    description: Main command for NT-nolightning plugin management.
    permission: noblitz.use
    aliases: [noblitz, nb, antilblitz, nl]
    usage: /<command> [help|status|reload|toggle|strike|clearthunder|resetstats|donate]
  noblitz:
    description: Legacy alias for NT-nolightning plugin management.
    permission: noblitz.use
    aliases: []
    usage: /<command> [help|status|reload|toggle|strike|clearthunder|resetstats|donate]

permissions:
  noblitz.use:
    description: Allows using basic NoBlitz info commands.
    default: true
  noblitz.admin:
    description: Full administrative access to NoBlitz.
    default: op
    children:
      noblitz.reload: true
      noblitz.toggle: true
      noblitz.strike: true
      noblitz.status: true
      noblitz.clearthunder: true
      noblitz.resetstats: true
      noblitz.bypass: true
  noblitz.reload:
    description: Allows reloading the NoBlitz configuration.
    default: op
  noblitz.toggle:
    description: Allows toggling protection in worlds.
    default: op
  noblitz.strike:
    description: Allows striking lightning on players/locations.
    default: op
  noblitz.status:
    description: Allows viewing status and statistics.
    default: op
  noblitz.clearthunder:
    description: Allows clearing thunder weather.
    default: op
  noblitz.resetstats:
    description: Allows resetting strike statistics.
    default: op
  noblitz.bypass:
    description: Allows bypassing trident channeling restrictions.
    default: op
